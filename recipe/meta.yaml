{% set name = "xinvert" %}
{% set version = "0.1.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7c706908742ad88c9d2a0176e66a2435a6c8edc2ded2f1248dd1e1d41009333d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - xarray
    - dask
    - numpy
    - numba
    - netCDF4
    - scipy

test:
  imports:
    - xinvert
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/miniufo/xinvert
  summary: 'Invert geophysical fluid dynamic problems (elliptic partial differential equations) using SOR iteration method'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://xinvert.readthedocs.io/
  dev_url: https://github.com/miniufo/xinvert

extra:
  recipe-maintainers:
    - miniufo
